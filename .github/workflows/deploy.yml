# =============================================================
# GitHub Actions CI/CD Workflow for NeoBank Pipeline
# =============================================================
# Triggers:
#   - Push to main  -> validate + deploy to dev
#   - Tag v*        -> validate + deploy to prod
#   - Pull request  -> validate only (no deploy)
# =============================================================

name: Deploy NeoBank Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:
  # -----------------------------------------------------------
  # Validate bundle on every push and PR
  # -----------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle (dev)
        run: databricks bundle validate --target dev

  # -----------------------------------------------------------
  # Deploy to dev on push to main
  # -----------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to dev
        run: databricks bundle deploy --target dev

  # -----------------------------------------------------------
  # Deploy to prod on version tags (e.g., v1.0.0)
  # -----------------------------------------------------------
  deploy-prod:
    name: Deploy to Prod
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy bundle to prod
        run: databricks bundle deploy --target prod
